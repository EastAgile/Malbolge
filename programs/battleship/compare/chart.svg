<svg xmlns="http://www.w3.org/2000/svg" width="760" height="756" viewBox="0 0 760 756" role="img" aria-labelledby="t d">
<title id="t">Battleship in Python, Rust and Malbolge</title>
<desc id="d">Log-scale bars comparing source lines, program size, run time and peak memory. The table in the README has the same numbers.</desc>
<style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--edge:#d6d5d0}.s-Python{fill:#2a78d6}.s-Rust{fill:#eb6834}.s-Malbolge{fill:#1baf7a}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#353532;--edge:#44443f}.s-Python{fill:#3987e5}.s-Rust{fill:#d95926}.s-Malbolge{fill:#199e70}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}.t2{fill:var(--ink2)}.h{font-size:15px;font-weight:600}.sub{font-size:12px}.lab{font-size:13px}.val{font-size:12px;font-variant-numeric:tabular-nums}.tick{font-size:10px}</style>
<rect x="0.5" y="0.5" width="759" height="755" rx="10" fill="var(--bg)" stroke="var(--edge)"/>
<text x="24" y="32" class="h" style="font-size:17px">Battleship: same game, three languages</text>
<text x="24" y="52" class="sub t2">Every bar is on a log scale: each grid line is ten times the one before. Shorter is better.</text>
